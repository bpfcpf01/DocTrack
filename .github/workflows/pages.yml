# เผยแพร่แอป พขร. (โฟลเดอร์ frontend/) ไปที่ branch gh-pages ทุกครั้งที่ push เข้า main
# GitHub Pages เสิร์ฟจาก gh-pages → https://<user>.github.io/<repo>/
name: Publish frontend to gh-pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push frontend/ to gh-pages
        working-directory: frontend
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish frontend from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
